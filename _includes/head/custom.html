{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Colour palette: applied before the first paint so there is no flash of the
     default palette. Kept inline and render-blocking on purpose -- an external
     or deferred script necessarily runs after the first paint. The id
     whitelist means a stale or hand-edited localStorage value cannot put the
     document into a palette that has no stylesheet. Registry: _data/palettes.yml -->
<script>
  (function () {
    var VALID = [{% for p in site.data.palettes.list %}"{{ p.id }}"{% unless forloop.last %}, {% endunless %}{% endfor %}];
    var FALLBACK = "{{ site.data.palettes.default }}";
    var stored = null;
    try {
      stored = window.localStorage.getItem("site-palette");
    } catch (e) {
      /* Safari private mode throws on localStorage access; fall back silently. */
    }
    document.documentElement.setAttribute(
      "data-palette",
      VALID.indexOf(stored) !== -1 ? stored : FALLBACK
    );
  })();
</script>

<!-- end custom head snippets -->
