<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #pdf-container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
        }
        canvas {
            display: block;
            margin: 0 auto 10px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            max-width: 100%;
        }
        /* 隐藏掉可能出现的下载按钮（虽然只是视觉上的） */
        .download-btn { display: none !important; }
        
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="pdf-container"></div>
    
    <div id="controls">
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomOut()">-</button>
    </div>

    <script>
        // 设置 PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // 获取 URL 参数中的 file
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');

        let pdfDoc = null;
        let scale = 1.2;
        const container = document.getElementById('pdf-container');

        if (!file) {
            container.innerHTML = '<p style="color:white; text-align:center; padding-top:50px;">No PDF file specified. Use ?file=path/to/file.pdf</p>';
        } else {
            // 加载 PDF
            pdfjsLib.getDocument(file).promise.then(function(pdfDoc_) {
                pdfDoc = pdfDoc_;
                renderAllPages();
            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                container.innerHTML = '<p style="color:white; text-align:center; padding-top:50px;">Error loading PDF: ' + error.message + '</p>';
            });
        }

        function renderAllPages() {
            container.innerHTML = ''; // 清空
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                renderPage(i);
            }
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                container.appendChild(canvas);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);
            });
        }

        function zoomIn() {
            scale += 0.2;
            renderAllPages();
        }

        function zoomOut() {
            if (scale > 0.4) {
                scale -= 0.2;
                renderAllPages();
            }
        }
        
        // 禁用右键菜单（防下载的小手段）
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
